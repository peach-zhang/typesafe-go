name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: 检查格式
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: 静态检查
        run: go vet ./...

      - name: 单元测试
        run: go test -race -count=1 ./...
